<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩 숙제 제출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Layout: 휴대폰 한 열. 위에서부터 이름·반 → 지문 고르기 → 지문별 해석 카드 → 아래 고정 제출 바 */
:root{
  --bg:#fffbea; --surface:#ffffff; --ink:#2e2a1c; --muted:#6e6750; --line:#f0e3b2;
  --accent:#ffd02e; --accent-ink:#2e2a1c; --accent-line:#9a7400; --mark:#ffe169;
  --lav:#fff0b3; --lav-ink:#6e5300; --pink:#ffdbe0; --pink-ink:#9a3447; --pink-soft:#fff6e0; --yel:#ffeb94;
  --soft:#fff5cf; --warn:#b03a4a; --ok:#2f6b4a; --ok-bg:#dff3e7; --mid:#8a5a00; --mid-bg:#ffe9c2;
  --mk-s:#ffe58a; --mk-sl:#8a6a00; --mk-v:#c0392b; --mk-n:#2f7a8c; --mk-m:#7b4fb0;
  --f-ui:"Gothic A1","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1b1910; --surface:#26231a; --ink:#f6f0d8; --muted:#bdb393; --line:#3f3922;
  --accent:#ffd02e; --accent-ink:#1b1910; --accent-line:#ffd84d; --mark:#8a6d00;
  --lav:#3b3416; --lav-ink:#ffe38a; --pink:#4a2830; --pink-ink:#ffc2cc; --pink-soft:#2c2618; --yel:#4d4114;
  --soft:#2f2b1b; --warn:#ff9fae; --ok:#9fe0bb; --ok-bg:#1f3b30; --mid:#ffd27a; --mid-bg:#3d3216; --mk-s:#5c4a12; --mk-sl:#ffd84d; --mk-v:#ff8a7a; --mk-n:#7fd3e6; --mk-m:#c9a5ff; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;
  padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 140px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header img{width:64px;height:auto;flex:none}
h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 mark{background:linear-gradient(transparent 55%,var(--mark) 55%);color:inherit;padding:0 2px}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel+.panel,.sec{margin-top:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input[type=text],textarea{font:16px var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:none;overflow:hidden;min-height:46px;line-height:1.5}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:15px;background:var(--bg);color:var(--ink);font-weight:600}
.seg input{accent-color:var(--accent-line)}
.seg label:has(input:checked){border-color:var(--accent-line);background:var(--soft)}
.stitle{font-size:15px;font-weight:800;margin:0 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stitle small{font-weight:400;color:var(--muted);font-size:13px}
.books{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.books button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);font:700 14px var(--f-ui);padding:8px 14px;border-radius:999px;cursor:pointer}
.books button[aria-selected=true]{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.pk{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 6px;cursor:pointer;font:inherit;text-align:center;min-width:0}
.pk b{display:block;font-size:16px}
.pk span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk[aria-pressed=true]{background:var(--yel);border-color:var(--accent-line)}
.pk[aria-pressed=true] b::after{content:" ✓";color:var(--pink-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:16px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--lav);color:var(--lav-ink)}
.ch b{font-size:17px}
.ch small{font-size:12.5px;font-weight:600}
.ch .prog{font-size:12px;font-weight:800;background:var(--surface);color:var(--ink);border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.hint{font-size:13px;color:var(--muted);margin:0}
.sl{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start}
.sl .no{height:46px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border-radius:10px;background:var(--soft);color:var(--lav-ink);font-variant-numeric:tabular-nums}
.sl .no.tg{flex-direction:column;line-height:1.05;font-size:13px}
.sl .no.tg i{font-style:normal;font-size:9.5px;font-weight:700}
.sl.done .no{background:var(--ok-bg);color:var(--ok)}
.blk h4{margin:0 0 6px;font-size:14px;font-weight:800}
.blk h4 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:4px}
.ans{display:flex;gap:8px;flex-wrap:wrap}
.ans button{width:46px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:800 18px var(--f-ui);cursor:pointer}
.ans button[aria-pressed=true]{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.nums{display:flex;gap:6px;flex-wrap:wrap}
.nums button{min-width:40px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:700 14px var(--f-ui);cursor:pointer;font-variant-numeric:tabular-nums}
.nums button[aria-pressed=true]{background:var(--pink);border-color:var(--pink-ink);color:var(--pink-ink)}
.words{display:flex;gap:6px;flex-wrap:wrap}
.words button{border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:600 14px var(--f-ui);padding:6px 12px;cursor:pointer}
.words button[aria-pressed=true]{background:var(--yel);border-color:var(--accent-line)}
.words button[aria-pressed=true]::before{content:"? ";color:var(--pink-ink);font-weight:800}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;color:var(--muted);margin-top:16px}
.empty img{width:84px;display:block;margin:0 auto 6px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(90,70,0,.08);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .cnt{font-size:13px;color:var(--muted);line-height:1.35}
.bar .cnt b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:800 16px var(--f-ui);padding:12px 22px;border-radius:12px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent-line);border-color:var(--accent-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.err{color:var(--warn);font-size:13px;font-weight:600;margin:6px 0 0}
.done-box{margin-top:16px;border-radius:18px;padding:18px;background:var(--pink-soft);display:flex;flex-direction:column;gap:10px}
.done-top{display:flex;align-items:center;gap:12px}
.done-top img{width:88px;flex:none}
.done-top b{font-size:18px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface);border-radius:10px;padding:10px;word-break:break-all;max-height:120px;overflow:auto;user-select:all}
.rm{border:0;background:transparent;color:var(--lav-ink);font:700 13px var(--f-ui);cursor:pointer;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.fs{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.fs-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fs-h b{font-size:15px}
.fs-h b i{font-style:normal;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:0 7px;margin-right:4px}
.chk{display:flex;gap:4px;flex-wrap:wrap}
.chk span{font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chk span.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tools button{border:0;background:transparent;color:var(--muted);font:800 14px var(--f-ui);padding:9px 2px;border-radius:9px;cursor:pointer}
.tools button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(90,70,0,.15)}
.tools button .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.how{font-size:13px;color:var(--ink);background:var(--surface);border-radius:10px;padding:8px 10px;border:1px dashed var(--accent-line)}
.mk{background:var(--surface);border-radius:12px;padding:6px 10px;border:1px solid var(--line)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--accent-line);background:var(--yel);color:var(--ink);font:700 14px var(--f-ui);padding:8px 12px;border-radius:999px;cursor:pointer}
.pick button.x{background:transparent;border-color:var(--line);color:var(--muted)}
.marks{display:flex;flex-wrap:wrap;gap:6px}
.marks span{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;max-width:100%}
.marks span em{font-style:normal;font-weight:800;font-size:11.5px}
.marks span q{quotes:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:210px}
.marks button{border:0;background:var(--soft);color:var(--muted);width:24px;height:24px;border-radius:50%;cursor:pointer;font-weight:800;flex:none}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.forms button{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px var(--f-ui);padding:9px 4px;border-radius:10px;cursor:pointer}
.forms button[aria-pressed=true]{background:var(--accent);border-color:var(--accent-line);color:var(--accent-ink)}
.lock{display:flex;gap:8px;margin-top:10px}
.lock input{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
.lbl{font-size:13px;font-weight:800;margin:0 0 4px}
.lbl small{font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img id="stk-hd" alt="">
    <div>
      <h1>리딩 숙제 <mark>제출</mark></h1>
      <p>★ 표시된 3문장을 분석하고 해석해서 제출하세요.</p>
    </div>
  </header>

  <div class="panel">
    <label class="f">이름<input type="text" id="nm" placeholder="예: 김최선" maxlength="12" autocomplete="off"></label>
    <div class="f" style="margin-top:12px;font-size:13px;color:var(--muted);font-weight:600">반
      <div class="seg" id="cls"></div>
    </div>
  </div>

  <div class="panel">
    <p class="stitle">숙제 지문 고르기 <small>숙제지 맨 위에 적힌 지문을 모두 눌러 주세요.</small></p>
    <div class="books" id="books" role="tablist"></div>
    <div id="lockbox"></div>
    <div class="picks" id="picks"></div>
  </div>

  <div id="cards"></div>
  <div id="done"></div>
</div>

<div class="bar"><div class="in">
  <div class="cnt" id="cnt"></div>
  <button class="btn" id="send" type="button">제출하기</button>
</div></div>

<script>
/* 문장 구조 표시·채점 (학생·선생님 페이지 공용) */
const MK={
  NF:['to부정사','원형부정사','동명사','현재분사','과거분사'],
  NFA:{'to부정사':'to','원형부정사':'원','동명사':'동','현재분사':'현분','과거분사':'과분'},
  MOD:['전치사구','to부정사구','분사구','분사구문','관계사절','부사절'],
  MODA:{'전치사구':'전','to부정사구':'to','분사구':'분','분사구문':'분구','관계사절':'관','부사절':'부'},
  FORM:['1형식','2형식','3형식','4형식','5형식'],
  esc:s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
  blank:()=>({tr:'',form:null,subj:[],verbs:[],nf:[],mods:[]}),
  /* toks: [[글자, 단어면1]], st: 표시 상태, o: {btn:눌러지는 버튼으로, pend:{mode,start}, sub:주어 고른 것} */
  render(toks,st,o={}){
    const n=toks.length, E=MK.esc;
    const inS=new Array(n).fill(-1); (st.subj||[]).forEach((c,k)=>{for(let i=c.s;i<=c.e;i++)inS[i]=k;});
    const isH=new Set((st.subj||[]).map(c=>c.h).filter(h=>h!=null));
    const V=new Set(st.verbs||[]);
    const NF={},NFO={}; (st.nf||[]).forEach(x=>{NF[x.i]=x.t; if(x.opt)NFO[x.i]=1;});
    const mods=(st.mods||[]).map((m,k)=>({...m,k}));
    let out='';
    for(let i=0;i<n;i++){
      const [t,w]=toks[i];
      const open=mods.filter(m=>m.s===i).sort((a,b)=>b.e-a.e);
      open.forEach(m=>{out+=`<span class="mk-p${m.opt?' opt':''}" data-m="${m.k}">(</span>`;});
      const cls=['mk-t']; if(w)cls.push('w');
      if(inS[i]>=0){cls.push('S'); if(i===st.subj[inS[i]].s)cls.push('Sb'); if(i===st.subj[inS[i]].e)cls.push('Se');}
      if(isH.has(i))cls.push('H');
      if(V.has(i))cls.push('V');
      if(NF[i])cls.push('N'); if(NFO[i])cls.push('opt');
      if(o.pend&&o.pend.start===i)cls.push('pend');
      if(o.pend&&o.pend.head&&inS[i]===o.pend.head.k)cls.push('pickh');
      const lab=(V.has(i)?'<sub class="mk-l xv">V</sub>':'')+(NF[i]?`<sub class="mk-l xn">${E(MK.NFA[NF[i]]||'')}</sub>`:'')+(inS[i]>=0&&i===st.subj[inS[i]].e?'<sub class="mk-l xs">S</sub>':'');
      const sp=i>0&&w&&!/^[(\[“‘"']$/.test(toks[i-1][0])?' ':(i>0&&!w&&/^[―—–(]$/.test(t)?' ':'');
      const spH=sp?(inS[i]>=0&&inS[i-1]===inS[i]?`<span class="S">${sp}</span>`:sp):'';
      out+=spH+(o.btn&&w?`<button type="button" class="${cls.join(' ')}" data-i="${i}">${E(t)}</button>`:`<span class="${cls.join(' ')}" data-i="${i}">${E(t)}</span>`)+lab;
      const close=mods.filter(m=>m.e===i).sort((a,b)=>b.s-a.s);
      close.forEach(m=>{out+=`<span class="mk-p${m.opt?' opt':''}" data-m="${m.k}">)</span><sub class="mk-l xm">${E(MK.MODA[m.t]||'?')}</sub>`;});
    }
    return out;
  },
  /* 채점: key = {form, subj:[{s,e,h}], verbs:[[i..]], nf:[{i,alt,t}], mods:[{s,e,t,opt}]} */
  score(key,st){
    st=st||MK.blank(); const r={};
    r.form={ok:st.form!=null&&(+st.form===+key.form||(key.formAlt||[]).includes(+st.form)), done:st.form!=null};
    // 주어: 덩어리 1점 + 핵심어 1점(핵심어 없는 명사절이면 덩어리만)
    let got=0,den=0; const usedS=new Set();
    key.subj.forEach(k=>{den+=k.h!=null?2:1; const rng=[[k.s,k.e],...(k.alt||[])];
      const j=(st.subj||[]).findIndex((c,ci)=>!usedS.has(ci)&&rng.some(([a,b])=>c.s===a&&c.e===b));
      if(j>=0){usedS.add(j); got+=1; if(k.h!=null&&(st.subj[j].h===k.h||(k.hs||[]).includes(st.subj[j].h)))got+=1;}});
    den+=(st.subj||[]).filter((c,ci)=>!usedS.has(ci)).length;
    r.subj=den?got/den:1;
    // 정동사: 절마다 동사 덩어리 전체를 맞혀야 1점, 엉뚱하게 고른 단어는 감점
    const V=new Set(st.verbs||[]); const all=new Set(key.verbs.flat());
    const okG=key.verbs.filter(g=>g.every(i=>V.has(i))).length; const extraV=[...V].filter(i=>!all.has(i)).length;
    r.verbs=(key.verbs.length+extraV)?okG/(key.verbs.length+extraV):1;
    // 준동사: 찾기 0.5 + 종류 0.5
    got=0; den=key.nf.filter(k=>!k.opt).length; const usedN=new Set();
    key.nf.forEach(k=>{const j=(st.nf||[]).findIndex((x,xi)=>!usedN.has(xi)&&(x.i===k.i||x.i===k.alt||(k.alts||[]).includes(x.i))); if(j>=0){usedN.add(j); if(!k.opt){got+=.5; if(st.nf[j].t===k.t)got+=.5;}}});
    den+=(st.nf||[]).filter((x,xi)=>!usedN.has(xi)).length;
    r.nf=den?got/den:1;
    // 수식어: 바깥 덩어리 0.5 + 종류 0.5, 안쪽(opt) 덩어리는 묶어도 감점 없음
    got=0; den=key.mods.filter(m=>!m.opt).length; const usedM=new Set();
    key.mods.forEach(k=>{const rng=[[k.s,k.e],...(k.alt||[])]; const j=(st.mods||[]).findIndex((x,xi)=>!usedM.has(xi)&&rng.some(([a,b])=>x.s===a&&x.e===b)); if(j>=0){usedM.add(j); if(!k.opt){got+=.5; if(st.mods[j].t===k.t)got+=.5;}}});
    den+=(st.mods||[]).filter((x,xi)=>!usedM.has(xi)).length;
    r.mods=den?got/den:1;
    return r;
  },
  /* 정답 상태(표시용)로 바꾸기 */
  keyState(key){return {subj:key.subj.map(c=>({...c})),verbs:key.verbs.flat(),nf:key.nf.map(x=>({i:x.i,t:x.t,opt:x.opt})),mods:key.mods.map(m=>({...m}))};},
  CSS:`
.mk{line-height:2.35;font-size:17px;word-break:keep-all;overflow-wrap:anywhere}
.mk .mk-t{font:inherit;color:inherit;background:none;border:0;padding:2px 1px;margin:0;border-radius:4px}
.mk button.mk-t{padding:4px 2px}
.mk button.mk-t{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mk button.mk-t:active{background:var(--soft)}
.mk .S{background:var(--mk-s);}

const CLASSES=["월금반", "월수반", "화목반"];
/* 구글 폼 연결: 주소와 칸 번호가 비어 있으면 '코드 복사' 방식으로 제출 */
const FORM={action:"https://docs.google.com/forms/d/e/1FAIpQLSf2OntsxmQPl-LtpNIUmkuZSun0iYfdJAPMyw2caS-ZGkRgiA/formResponse", name:"entry.1640684023", cls:"entry.2094010342", data:"entry.1573792350"};

const $=s=>document.querySelector(s);
const esc=MK.esc;
document.head.insertAdjacentHTML('beforeend','<style>'+MK.CSS+'</style>');
const CIRC=['①','②','③','④','⑤','⑥','⑦'];
$('#stk-hd').src=STK['5']||'';

const sets=[]; PSG.forEach(p=>{let s=sets.find(x=>x.set===p.set); if(!s){s={set:p.set,label:p.setLabel,list:[]};sets.push(s);} s.list.push(p);});
let curSet=sets[0]?.set||'';
const picked=[];           // 고른 지문 id
const st={};               // id -> {f:{n:{tr,form,subj,verbs,nf,mods}}, a, e, u, uo, m}
const TXT={};              // 풀린 문장 글자: id -> {n: toks}
const CODES={};            // set -> 코드
const S=id=>{const p=P(id); if(!st[id])st[id]={f:{},a:null,e:[],u:[],uo:'',m:[]}; const o=st[id]; (p.F||[]).forEach(n=>{if(!o.f[n])o.f[n]=MK.blank();}); return o;};
const P=id=>PSG.find(p=>p.id===id);
const UI={};               // id+n -> {mode, pend, pick}
const ui=(id,n)=>UI[id+'|'+n]||(UI[id+'|'+n]={mode:'subj',pend:null,pick:null});

/* ---------- 숙제지 코드로 문장 풀기 ---------- */
const b64u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(set,code){
  const e=ENC[set]; if(!e)return false;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u(e.salt),iterations:e.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u(e.iv)},key,b64u(e.ct));
    Object.assign(TXT,JSON.parse(new TextDecoder().decode(pt))); CODES[set]=code.trim().toUpperCase(); return true;
  }catch(err){return false;}
}
const unlocked=set=>!!CODES[set];

/* ---------- 임시 저장 (이 기기에서만) ---------- */
const KEY='rd-draft-v2';
function saveDraft(){try{localStorage.setItem(KEY,JSON.stringify({nm:$('#nm').value,cls:clsVal(),picked,st,set:curSet,codes:CODES,at:Date.now()}));}catch(e){}}
async function loadDraft(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null'); if(!d||Date.now()-d.at>1000*60*60*24*14)return;
  $('#nm').value=d.nm||''; if(d.cls){const r=document.querySelector(`input[name=cls][value="${d.cls}"]`); if(r)r.checked=true;}
  for(const [set,code] of Object.entries(d.codes||{}))await unlock(set,code);
  (d.picked||[]).forEach(id=>{const p=P(id); if(p&&unlocked(p.set))picked.push(id);}); Object.assign(st,d.st||{}); if(d.set&&sets.some(s=>s.set===d.set))curSet=d.set;}catch(e){}}
function clsVal(){return document.querySelector('input[name=cls]:checked')?.value||'';}
$('#cls').innerHTML=CLASSES.map((c,i)=>`<label><input type="radio" name="cls" id="cls-${i}" value="${esc(c)}"> ${esc(c)}</label>`).join('');

function renderBooks(){
  $('#books').innerHTML=sets.map(s=>`<button type="button" role="tab" data-s="${esc(s.set)}" aria-selected="${s.set===curSet}">${esc(s.label)}</button>`).join('');
  const s=sets.find(x=>x.set===curSet);
  if(s&&!unlocked(s.set)){
    $('#lockbox').innerHTML=`<p class="hint">숙제지 맨 위 오른쪽에 있는 <b>코드</b>를 넣어 주세요.</p><div class="lock"><input type="text" id="code-in" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="코드 6자리" aria-label="숙제지 코드"><button class="btn" type="button" id="code-go">열기</button></div><p class="err" id="code-err"></p>`;
    $('#picks').innerHTML='';
    const go=async()=>{const v=$('#code-in').value; if(!v.trim())return; $('#code-go').disabled=true;
      const ok=await unlock(s.set,v); $('#code-go').disabled=false;
      if(ok){saveDraft();renderBooks();} else $('#code-err').textContent='코드가 맞지 않아요. 숙제지의 코드를 다시 확인해 주세요. (숫자 0과 영어 O를 헷갈리기 쉬워요)';};
    $('#code-go').onclick=go; $('#code-in').onkeydown=e=>{if(e.key==='Enter')go();};
    return;
  }
  $('#lockbox').innerHTML='';
  $('#picks').innerHTML=s?s.list.map(p=>`<button type="button" class="pk" data-id="${esc(p.id)}" aria-pressed="${picked.includes(p.id)}"><b>${esc(p.label.replace(/\s*\(.*\)$/,''))}</b><span>${esc(p.src==='rs'?(p.label.match(/\((.*)\)/)||[,''])[1]:p.qtype)}</span></button>`).join(''):'';
}
$('#books').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;curSet=b.dataset.s;renderBooks();saveDraft();});
$('#picks').addEventListener('click',e=>{const b=e.target.closest('.pk');if(!b)return;const id=b.dataset.id;
  const i=picked.indexOf(id);
  if(i>=0){ if(progress(id).any&&!b.dataset.sure){b.dataset.sure='1';b.querySelector('span').textContent='한 번 더 누르면 빼요';setTimeout(()=>{delete b.dataset.sure;renderBooks();},2200);return;} picked.splice(i,1);}
  else{picked.push(id); picked.sort((a,b)=>PSG.findIndex(p=>p.id===a)-PSG.findIndex(p=>p.id===b));}
  renderBooks();renderCards();saveDraft();});

/* 진행도: 문장마다 해석·형식·주어·동사 4가지 */
function sentDone(f){return {tr:!!(f.tr||'').trim(),form:f.form!=null,subj:f.subj.length>0,verbs:f.verbs.length>0,nf:f.nf.length>0,mods:f.mods.length>0};}
function progress(id){const p=P(id),s=S(id); let done=0,any=false;
  (p.F||[]).forEach(n=>{const d=sentDone(s.f[n]); if(d.tr&&d.form&&d.subj&&d.verbs)done++; if(d.tr||d.form||d.subj||d.verbs)any=true;});
  if(s.a!=null)any=true; return {done,total:(p.F||[]).length,any};}

const TOOL={subj:{nm:'주어',c:'var(--mk-s)',how:'주어 덩어리의 <b>첫 단어</b>와 <b>끝 단어</b>를 차례로 누르세요. 그다음 그 안의 <b>핵심어</b>를 누르세요. 절마다 주어가 있으면 모두 찾아요.'},
  verbs:{nm:'동사',c:'var(--mk-v)',how:'정동사를 누르세요. 조동사·be·have까지 <b>동사 덩어리를 전부</b> 눌러요. (never, not은 빼요) 다시 누르면 지워져요.'},
  nf:{nm:'준동사',c:'var(--mk-n)',how:'to부정사·원형부정사·동명사·분사를 누르고 종류를 고르세요. to부정사는 동사원형을 누르면 돼요.'},
  mods:{nm:'수식어',c:'var(--mk-m)',how:'꾸며 주는 말 덩어리(두 단어 이상)의 <b>첫 단어</b>와 <b>끝 단어</b>를 누르고 종류를 고르세요. 바깥 덩어리만 묶으면 돼요.'}};

function sentHTML(p,n){
  const f=S(p.id).f[n], u=ui(p.id,n), toks=TXT[p.id]?.[n]; if(!toks)return '';
  const d=sentDone(f);
  const tabs=Object.entries(TOOL).map(([k,t])=>`<button type="button" role="tab" data-tool="${k}" aria-selected="${u.mode===k}"><span class="dot" style="background:${t.c}"></span>${t.nm}</button>`).join('');
  let how=TOOL[u.mode].how;
  if(u.pend&&u.pend.start!=null)how=`<b>끝 단어</b>를 누르세요. (한 단어면 같은 단어를 한 번 더)`;
  if(u.pend&&u.pend.head)how=`밑줄 점선 안에서 <b>핵심어</b> 한 단어를 누르세요.`;
  let pick='';
  if(u.pick){const opts=u.pick.kind==='nf'?MK.NF:MK.MOD;
    pick=`<div class="pick" data-pick="1">${opts.map(o=>`<button type="button" data-t="${esc(o)}">${esc(o)}</button>`).join('')}<button type="button" class="x" data-t="">취소</button></div>`;
    how=u.pick.kind==='nf'?`<b>${esc(toks[u.pick.i][0])}</b>의 종류를 고르세요.`:`고른 덩어리의 종류를 고르세요.`;}
  const txt=(s,e)=>toks.slice(s,e+1).map(t=>t[0]).join(' ').replace(/\s([,.;:!?’)])/g,'$1');
  const list=[];
  f.subj.forEach((c,k)=>list.push(`<span><em style="color:var(--mk-sl)">S</em><q>${esc(txt(c.s,c.e))}${c.h!=null?` · 핵심 ${esc(toks[c.h][0])}`:' · 핵심어 안 고름'}</q><button type="button" data-del="subj" data-k="${k}" aria-label="지우기">×</button></span>`));
  f.nf.forEach((x,k)=>list.push(`<span><em style="color:var(--mk-n)">${esc(MK.NFA[x.t])}</em><q>${esc(toks[x.i][0])} · ${esc(x.t)}</q><button type="button" data-del="nf" data-k="${k}" aria-label="지우기">×</button></span>`));
  f.mods.forEach((m,k)=>list.push(`<span><em style="color:var(--mk-m)">${esc(m.t)}</em><q>${esc(txt(m.s,m.e))}</q><button type="button" data-del="mods" data-k="${k}" aria-label="지우기">×</button></span>`));
  return `<div class="fs" data-n="${n}">
    <div class="fs-h"><b><i>★ ${n}</i>번 문장</b><div class="chk"><span class="${d.subj&&d.verbs?'on':''}">주어·동사</span><span class="${d.form?'on':''}">형식</span><span class="${d.tr?'on':''}">해석</span></div></div>
    <div class="tools" role="tablist">${tabs}</div>
    <div class="how">${how}</div>
    <div class="mk">${MK.render(toks,f,{btn:true,pend:u.pend&&u.pend.start!=null?{start:u.pend.start}:u.pend&&u.pend.head?{head:u.pend.head}:null})}</div>
    ${pick}
    ${list.length?`<div class="marks">${list.join('')}</div>`:''}
    <div><p class="lbl">문장 형식 <small>주절 기준</small></p><div class="forms">${MK.FORM.map((t,i)=>`<button type="button" data-form="${i+1}" aria-pressed="${f.form===i+1}">${t}</button>`).join('')}<button type="button" data-form="0" aria-pressed="${f.form===0}">수동태 (형식 X)</button></div></div>
    <div><p class="lbl">해석</p><textarea rows="2" data-tr="1" id="tr-${esc(p.id)}-${n}" placeholder="${n}번 문장 해석">${esc(f.tr||'')}</textarea></div>
  </div>`;
}
function qBlock(p,s,k,q){
  const val=k<0?s.a:(s.m[k]??null); const lab=q.letters?(i=>String.fromCharCode(97+i)):(i=>CIRC[i]);
  const qn=p.qn?p.qn[k+1]:'';
  return `<div class="blk"><h4>${p.src==='rs'?`교재 ${esc(qn)}번 답`:'문제 답'}<small>${p.src==='rs'?'':'시험지 '+p.no+'번'}</small></h4>
    <div class="ans" data-k="${k}">${Array.from({length:q.nc},(_,i)=>`<button type="button" data-v="${i+1}" aria-pressed="${val===i+1}" aria-label="${i+1}번">${lab(i)}</button>`).join('')}</div></div>`;
}
function cardHTML(id){const p=P(id),s=S(id),pr=progress(id);
  const qs=[]; if(p.q)qs.push(qBlock(p,s,-1,p.q)); (p.mq||[]).forEach((q,k)=>qs.push(qBlock(p,s,k,q)));
  const ev=p.q?`<div class="blk"><h4>정답 근거 문장<small>숙제지 문장 번호 (최대 3개)</small></h4><div class="nums" data-ev="1">${Array.from({length:p.n},(_,i)=>`<button type="button" data-v="${i+1}" aria-pressed="${s.e.includes(i+1)}">${i+1}</button>`).join('')}</div></div>`:'';
  const wd=`<div class="blk"><h4>모르는 단어<small>뜻을 몰랐던 단어를 눌러 주세요</small></h4><div class="words">${(p.v||[]).map(w=>`<button type="button" data-w="${esc(w)}" aria-pressed="${s.u.includes(w)}">${esc(w)}</button>`).join('')}</div>
    <input type="text" data-uo="1" id="uo-${esc(id)}" style="margin-top:8px" placeholder="다른 모르는 단어 (쉼표로 구분)" value="${esc(s.uo||'')}"></div>`;
  return `<section class="card" data-id="${esc(id)}"><div class="ch"><div><b>${esc(p.setLabel)} ${esc(p.label)}</b><br><small>${esc(p.qtype)}</small></div><span class="prog">★ ${pr.done} / ${pr.total}</span></div>
    <div class="cb">${(p.F||[]).map(n=>sentHTML(p,n)).join('')}${qs.join('')}${ev}${wd}</div></section>`;}
function renderCards(){
  if(!picked.length){$('#cards').innerHTML=`<div class="empty"><img src="${STK['2']||''}" alt=""><b>위에서 숙제 지문을 골라 주세요</b><br>지문마다 ★ 3문장이 나와요. 단어를 눌러 주어·동사·준동사·수식어를 표시해요.</div>`;updateBar();return;}
  $('#cards').innerHTML=picked.map(cardHTML).join('');
  document.querySelectorAll('#cards textarea').forEach(grow); updateBar();
}
function rerenderSent(id,n){const card=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if(!card)return;
  const el=card.querySelector(`.fs[data-n="${n}"]`); const tmp=document.createElement('div'); tmp.innerHTML=sentHTML(P(id),n); el.replaceWith(tmp.firstElementChild);
  const ta=card.querySelector(`.fs[data-n="${n}"] textarea`); if(ta)grow(ta);
  const pr=progress(id); card.querySelector('.prog').textContent=`★ ${pr.done} / ${pr.total}`; updateBar(); saveDraft();}
function grow(t){t.style.height='auto';t.style.height=Math.max(46,t.scrollHeight+2)+'px';}

$('#cards').addEventListener('input',e=>{const t=e.target;const card=t.closest('.card');if(!card)return;const id=card.dataset.id,s=S(id);
  if(t.dataset.tr){const n=+t.closest('.fs').dataset.n; s.f[n].tr=t.value; grow(t);
    const fs=t.closest('.fs'); fs.querySelector('.chk span:nth-child(3)').classList.toggle('on',!!t.value.trim());
    const pr=progress(id); card.querySelector('.prog').textContent=`★ ${pr.done} / ${pr.total}`;}
  else if(t.dataset.uo){s.uo=t.value;}
  updateBar();saveDraft();});

$('#cards').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const card=b.closest('.card');if(!card)return;const id=card.dataset.id,s=S(id);
  const fs=b.closest('.fs');
  if(fs){const n=+fs.dataset.n, f=s.f[n], u=ui(id,n);
    if(b.dataset.tool){u.mode=b.dataset.tool;u.pend=null;u.pick=null;return rerenderSent(id,n);}
    if(b.dataset.form!=null){const v=+b.dataset.form; f.form=f.form===v?null:v; return rerenderSent(id,n);}
    if(b.dataset.del){f[b.dataset.del].splice(+b.dataset.k,1); u.pend=null; u.pick=null; return rerenderSent(id,n);}
    if(b.closest('[data-pick]')){const t=b.dataset.t;
      if(t){ if(u.pick.kind==='nf')f.nf.push({i:u.pick.i,t}); else f.mods.push({s:u.pick.s,e:u.pick.e,t}); }
      u.pick=null; return rerenderSent(id,n);}
    if(b.classList.contains('mk-t')){const i=+b.dataset.i;
      if(u.pick)return;
      if(u.mode==='verbs'){const k=f.verbs.indexOf(i); k>=0?f.verbs.splice(k,1):f.verbs.push(i); f.verbs.sort((a,b)=>a-b); return rerenderSent(id,n);}
      if(u.mode==='nf'){const k=f.nf.findIndex(x=>x.i===i); if(k>=0)f.nf.splice(k,1); else u.pick={kind:'nf',i}; return rerenderSent(id,n);}
      if(u.pend&&u.pend.head){const c=f.subj[u.pend.head.k]; if(c&&i>=c.s&&i<=c.e){c.h=i;u.pend=null;} return rerenderSent(id,n);}
      if(u.pend&&u.pend.start!=null){const a=Math.min(u.pend.start,i), z=Math.max(u.pend.start,i); u.pend=null;
        if(u.mode==='subj'){f.subj.push({s:a,e:z,h:a===z?a:null}); if(a!==z)u.pend={head:{k:f.subj.length-1}};}
        else u.pick={kind:'mod',s:a,e:z};
        return rerenderSent(id,n);}
      u.pend={start:i}; return rerenderSent(id,n);}
    return;}
  const ans=b.closest('.ans'), nums=b.closest('.nums'), words=b.closest('.words');
  if(ans){const k=+ans.dataset.k,v=+b.dataset.v; if(k<0)s.a=s.a===v?null:v; else s.m[k]=s.m[k]===v?null:v;
    ans.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===(k<0?s.a:s.m[k])));}
  else if(nums){const v=+b.dataset.v,i=s.e.indexOf(v); if(i>=0)s.e.splice(i,1); else{ if(s.e.length>=3)s.e.shift(); s.e.push(v);} s.e.sort((a,b)=>a-b);
    nums.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',s.e.includes(+x.dataset.v)));}
  else if(words){const w=b.dataset.w,i=s.u.indexOf(w); if(i>=0)s.u.splice(i,1); else s.u.push(w); b.setAttribute('aria-pressed',s.u.includes(w));}
  updateBar();saveDraft();});
$('#nm').addEventListener('input',()=>{updateBar();saveDraft();});
$('#cls').addEventListener('change',()=>{updateBar();saveDraft();});

function totals(){let d=0,n=0;picked.forEach(id=>{const pr=progress(id);d+=pr.done;n+=pr.total;});return {d,n};}
function updateBar(){const {d,n}=totals();
  $('#cnt').innerHTML=picked.length?`지문 <b>${picked.length}</b>개 · ★ 문장 <b>${d}</b> / ${n} 완성`:'지문을 골라 주세요';
  $('#send').disabled=!picked.length;}

/* 제출 */
const b64=s=>btoa(unescape(encodeURIComponent(s)));
function payload(){
  return {v:2,nm:$('#nm').value.trim(),c:clsVal(),t:Date.now(),
    p:picked.map(id=>{const p=P(id),s=S(id); const f={}; (p.F||[]).forEach(n=>{const x=s.f[n]; f[n]={tr:(x.tr||'').trim(),form:x.form,subj:x.subj,verbs:x.verbs,nf:x.nf,mods:x.mods};});
      return {id,f,a:s.a,e:s.e,u:s.u,uo:(s.uo||'').trim(),m:(p.mq||[]).map((q,k)=>s.m[k]??null)};})};
}
let sending=false;
$('#send').addEventListener('click',async()=>{
  const nm=$('#nm').value.trim(), c=clsVal(); const miss=[]; if(!nm)miss.push('이름'); if(!c)miss.push('반');
  let er=$('#bar-err'); if(!er){er=document.createElement('p');er.id='bar-err';er.className='err';$('#done').before(er);}
  if(miss.length){er.textContent=`${miss.join('과 ')}을(를) 먼저 적어 주세요. (맨 위)`; window.scrollTo({top:0,behavior:'smooth'}); return;}
  const {d,n}=totals();
  if(d<n&&!$('#send').dataset.sure){$('#send').dataset.sure='1';$('#send').textContent='그래도 제출';er.textContent=`아직 다 하지 않은 ★ 문장이 ${n-d}개 있어요. (해석·형식·주어·동사) 그래도 제출하려면 한 번 더 누르세요.`;setTimeout(()=>{delete $('#send').dataset.sure;$('#send').textContent='제출하기';},5000);return;}
  er.textContent=''; if(sending)return; sending=true; $('#send').disabled=true; $('#send').textContent='보내는 중…';
  const code='RD2.'+b64(JSON.stringify(payload()));
  let ok=false;
  if(FORM.action&&FORM.name&&FORM.data){
    try{const fd=new URLSearchParams(); fd.append(FORM.name,nm); if(FORM.cls)fd.append(FORM.cls,c); fd.append(FORM.data,code);
      await fetch(FORM.action,{method:'POST',mode:'no-cors',body:fd}); ok=true;}catch(e){ok=false;}
  }
  sending=false; $('#send').textContent='제출하기'; $('#send').disabled=false; delete $('#send').dataset.sure;
  const list=picked.map(id=>{const p=P(id);return `${p.setLabel} ${p.label.replace(/\s*\(.*\)$/,'')}`;}).join(', ');
  $('#done').innerHTML=`<div class="done-box"><div class="done-top"><img src="${STK['3']||''}" alt=""><div><b>${ok?'제출 완료! 수고했어요':'제출 코드가 만들어졌어요'}</b><div class="hint">${esc(nm)} · ${esc(c)} · ${esc(list)}</div></div></div>
    ${ok?`<p class="hint" style="margin:0">선생님께 바로 전달됐어요. 채점 결과는 수업 시간에 피드백지로 받아요.</p>`
       :`<p class="hint" style="margin:0">아래 코드를 <b>전부 복사</b>해서 선생님께 보내 주세요.</p><div class="code" id="code">${esc(code)}</div><button class="btn ghost" type="button" id="cp">코드 복사</button>`}
    <button class="rm" type="button" id="clr">다음 숙제를 위해 이 기기의 작성 내용 지우기</button></div>`;
  $('#done').scrollIntoView({behavior:'smooth',block:'start'});
  const cp=$('#cp'); if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(code);cp.textContent='복사했어요 ✓';}catch(e){const r=document.createRange();r.selectNodeContents($('#code'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);cp.textContent='선택됐어요 · 복사해 주세요';}};
  $('#clr').onclick=()=>{picked.length=0;for(const k in st)delete st[k];for(const k in UI)delete UI[k];saveDraft();renderBooks();renderCards();$('#done').innerHTML='';window.scrollTo({top:0});};
});

(async()=>{await loadDraft(); renderBooks(); renderCards();})();
</script>
</body>
</html>
